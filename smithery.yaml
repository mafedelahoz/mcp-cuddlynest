# Smithery configuration — https://smithery.ai/docs/config
#
# Two ways to list this server on Smithery:
#
#   A. Register the already-hosted endpoint (free, recommended): Smithery →
#      "Add a remote server by URL" → paste  https://<host>/mcp
#      (see deploy/hf-space/DEPLOY.md). No build on Smithery's side.
#
#   B. Let Smithery build & host the container from this config:

runtime: container
build:
  dockerfile: Dockerfile
  dockerBuildPath: .
startCommand:
  type: http
  # The server reads configuration from process env at start (CUDDLYNEST_* /
  # IGNORE_ROBOTS_TXT), not per-session, so there is no session configSchema.
  configSchema:
    type: object
    properties: {}
  exampleConfig: {}
