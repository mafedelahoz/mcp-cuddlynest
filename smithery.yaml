# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml

startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      ignoreRobotsTxt:
        type: boolean
        default: false
        description: If set to true, the server ignores robots.txt rules for listing-page fetches.
      scrapeTimeoutMs:
        type: number
        default: 35000
        description: >-
          Max time (ms) to wait for a listing page's rooms/prices to render in the
          headless browser.
  commandFunction:
    |-
    (config) => {
      const args = ['dist/index.js'];
      if (config.ignoreRobotsTxt) args.push('--ignore-robots-txt');
      const env = { ...process.env };
      if (config.scrapeTimeoutMs) env.CUDDLYNEST_SCRAPE_TIMEOUT_MS = String(config.scrapeTimeoutMs);
      return { command: 'node', args, env };
    }
  exampleConfig:
    ignoreRobotsTxt: false
    scrapeTimeoutMs: 35000
